        function exportSelectedToWord() {
            const selectedNotes = notes.filter(n => selectedNoteIds.has(n.id) && !n.isDeleted);
            if (selectedNotes.length === 0) {
                alert('请至少选择一条备忘录');
                return;
            }

            const exportBtn = document.querySelector('#selection-bar button:first-child');
            const originalHtml = exportBtn.innerHTML;
            exportBtn.disabled = true;
            exportBtn.innerHTML = '<span>生成中…</span>';

            try {
                // 构建 Word 兼容的 HTML 文档（Word 直接打开，无需外部库）
                let docHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office'
                    xmlns:w='urn:schemas-microsoft-com:office:word'
                    xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset="UTF-8">
                    <title>Spark.Memo 备忘录导出</title>
                    <!--[if gte mso 9]>
                    <xml>
                        <w:WordDocument><w:View>Print</w:View></w:WordDocument>
                    </xml>
                    <![endif]-->
                    <style>
                        body { font-family: 'Microsoft YaHei', sans-serif; padding: 40pt; }
                        h1 { font-size: 18pt; color: #1a1a1a; border-bottom: 1px solid #d0d0d0; padding-bottom: 6pt; margin-top: 20pt; margin-bottom: 4pt; }
                        .meta { font-size: 9pt; color: #999; margin-bottom: 10pt; }
                        .content { font-size: 11pt; line-height: 1.7; color: #333; white-space: pre-wrap; margin-bottom: 10pt; }
                        hr.sep { border: none; border-top: 1px dashed #ccc; margin: 24pt 0; }
                    </style>
                </head>
                <body>`;

                selectedNotes.forEach((note, index) => {
                    const title = escapeHtml(note.title) || '未命名备忘';
                    const dateStr = formatDate(note.updatedAt);
                    const tagStr = note.tag ? escapeHtml(note.tag) : '';
                    const contentHtml = escapeHtml(note.content || '').replace(/\n/g, '<br>');

                    if (index > 0) docHtml += '<hr class="sep">';
                    docHtml += `<h1>${title}</h1>`;
                    docHtml += `<p class="meta">日期：${dateStr}${tagStr ? '&emsp;标签：' + tagStr : ''}</p>`;
                    docHtml += `<p class="content">${contentHtml || '&nbsp;'}</p>`;
                });

                docHtml += '</body></html>';

                const blob = new Blob(['﻿' + docHtml], { type: 'application/msword' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Spark.Memo-备忘导出-${new Date().toLocaleDateString('zh-CN')}.doc`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                exitSelectionMode();
            } catch (err) {
                alert('导出失败：' + err.message);
            } finally {
                exportBtn.disabled = false;
                exportBtn.innerHTML = originalHtml;
                lucide.createIcons();
            }
        }

        function saveDataToStorage() {
            // 定制排序算法：未删除的按 [置顶优先 -> 时间倒序] 排序；已被删除的排在最后面
            notes.sort((a, b) => {
                if (a.isDeleted !== b.isDeleted) return a.isDeleted - b.isDeleted;
                if (!a.isDeleted) {
                    if (a.isStarred !== b.isStarred) return b.isStarred - a.isStarred;
                }
                return new Date(b.updatedAt) - new Date(a.updatedAt);
            });
            localStorage.setItem('memos_data', JSON.stringify(notes));
            if (window.sparkBridge && window.sparkBridge.updateSyncData) {
                window.sparkBridge.updateSyncData({ notes, activeNoteId });
            }
        }

        // --- 过滤与搜索调度 ---
        function handleSearch(val) {
            currentSearchQuery = val.trim().toLowerCase();
            renderSidebar();
        }

        function getFilteredNotes() {
            return notes.filter(note => {
                const matchesSearch = note.title.toLowerCase().includes(currentSearchQuery) || note.content.toLowerCase().includes(currentSearchQuery);
                if (currentFilterTag === 'trash') {
                    return note.isDeleted && matchesSearch;
                } else {
                    const matchesTag = currentFilterTag === 'all' || note.tag === currentFilterTag;
                    return !note.isDeleted && matchesSearch && matchesTag;
                }
            });
        }

        function filterByTag(tag) {
            currentFilterTag = tag;
            // 切换视图时自动退出多选模式
            if (isSelectionMode) exitSelectionMode();
            
            // 同步常规标签样式
            ['all', '工作', '生活', '灵感'].forEach(t => {
                const btn = document.getElementById(`tag-filter-${t}`);
                if (t === tag) {
                    btn.className = "px-2 py-0.5 rounded bg-neutral-200 dark:bg-neutral-800 text-neutral-800 dark:text-neutral-200 font-medium transition-all";
                } else {
                    btn.className = "px-2 py-0.5 rounded hover:bg-neutral-200/40 dark:hover:bg-neutral-800/40 text-neutral-400 dark:text-neutral-500 transition-all";
                }
            });
            
            // 同步底部回收站专属样式
            const trashBtn = document.getElementById('tag-filter-trash');
            if (tag === 'trash') {
                trashBtn.className = "w-full flex items-center justify-between px-3 py-1.5 rounded-lg text-[13px] bg-neutral-200 dark:bg-neutral-800 text-neutral-800 dark:text-neutral-200 font-medium transition-all";
            } else {
                trashBtn.className = "w-full flex items-center justify-between px-3 py-1.5 rounded-lg text-[13px] text-neutral-500 dark:text-neutral-400 hover:bg-neutral-200/50 dark:hover:bg-neutral-800/50 hover:text-neutral-900 dark:hover:text-neutral-100 transition-all duration-200";
            }
            
            // 视图切换后的焦点对齐
            const currentViewNotes = getFilteredNotes();
            if (currentViewNotes.length > 0) {
                const isStillVisible = currentViewNotes.find(n => n.id === activeNoteId);
                if (!isStillVisible) switchActiveNote(currentViewNotes[0].id);
            } else {
                showEmptyState();
            }

            renderSidebar();
        }

        // --- 视图渲染层 ---
        function renderSidebar() {
            const listContainer = document.getElementById('note-list');
            listContainer.innerHTML = '';

            const filteredNotes = getFilteredNotes();

            // 实时同步回收站内现存的碎片总数
            const trashNotesCount = notes.filter(n => n.isDeleted).length;
            document.getElementById('trash-count').innerText = trashNotesCount;

            if (filteredNotes.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 text-neutral-400/50 dark:text-neutral-500/40 text-xs tracking-wide">
                        ${currentFilterTag === 'trash' ? '回收站空空如也' : '无符合条件的备忘'}
                    </div>
                `;
                return;
            }

            filteredNotes.forEach(note => {
                const isActive = note.id === activeNoteId;
                const noteElement = document.createElement('div');
                noteElement.id = `sidebar-item-${note.id}`;
                noteElement.onclick = (e) => {
                    if (e.target.closest('input[type="checkbox"]')) return;
                    if (isSelectionMode && !note.isDeleted) {
                        const checkbox = noteElement.querySelector('input[type="checkbox"]');
                        if (checkbox) {
                            checkbox.checked = !checkbox.checked;
                            toggleNoteSelection(note.id, checkbox.checked);
                        }
                    } else {
                        switchActiveNote(note.id);
                    }
                };

                const isSelected = selectedNoteIds.has(note.id);
                noteElement.className = `group relative p-3.5 mx-2 rounded-xl cursor-pointer transition-all duration-200 text-left select-none
                    ${isActive && !isSelectionMode
                        ? 'bg-white dark:bg-[#1C1C1E] shadow-soft dark:shadow-soft-dark border border-neutral-200/40 dark:border-neutral-800/60'
                        : isSelected
                            ? 'bg-blue-50 dark:bg-blue-900/10 border border-blue-200/40 dark:border-blue-700/30'
                            : 'hover:bg-neutral-200/40 dark:hover:bg-neutral-800/40 border border-transparent'
                    }`;

                noteElement.innerHTML = `
                    <div class="flex items-start gap-2">
                        <div class="${isSelectionMode && !note.isDeleted ? 'pt-0.5 flex-shrink-0' : 'hidden'}">
                            <input type="checkbox" onchange="toggleNoteSelection('${note.id}', this.checked)"
                                ${isSelected ? 'checked' : ''}
                                class="w-3.5 h-3.5 rounded border-neutral-300 dark:border-neutral-600 cursor-pointer accent-neutral-900 dark:accent-neutral-100">
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-start justify-between space-x-2">
                                <h3 class="text-[13.5px] font-medium truncate flex-1 text-neutral-800 dark:text-neutral-200">
                                    ${escapeHtml(note.title) || '<span class="text-neutral-300 dark:text-neutral-700 italic font-normal">未命名备忘</span>'}
                                </h3>
                                <div class="flex items-center space-x-1 flex-shrink-0 pt-0.5">
                                    ${note.isStarred ? '<i data-lucide="star" class="w-3 h-3 fill-amber-400 stroke-amber-400"></i>' : ''}
                                </div>
                            </div>
                            <p class="text-[11.5px] text-neutral-400 dark:text-neutral-500 line-clamp-2 mt-1 font-normal leading-normal break-all">
                                ${escapeHtml(note.content) || '空内容'}
                            </p>
                            <div class="flex items-center justify-between mt-2.5">
                                <span class="text-[10px] text-neutral-400/70 dark:text-neutral-500/60 font-mono">${formatDate(note.isDeleted ? note.deletedAt : note.updatedAt)}</span>
                                ${note.tag && !note.isDeleted ? `<span class="text-[9px] px-1.5 py-0.5 rounded font-medium ${tagColors[note.tag]}">${note.tag}</span>` : ''}
                                ${note.isDeleted ? `<span class="text-[9px] px-1.5 py-0.5 rounded font-medium bg-neutral-200/50 dark:bg-neutral-800/50 text-neutral-400 dark:text-neutral-500">已删除</span>` : ''}
                            </div>
                        </div>
                    </div>`;
                listContainer.appendChild(noteElement);
            });
            lucide.createIcons();
        }

        function updateSidebarItemDOM(note) {
            const item = document.getElementById(`sidebar-item-${note.id}`);
            if (!item) return;
            
            const titleEl = item.querySelector('h3');
            const contentEl = item.querySelector('p');
            const dateEl = item.querySelector('span');

            if (titleEl) titleEl.innerHTML = escapeHtml(note.title) || '<span class="text-neutral-300 dark:text-neutral-700 italic font-normal">未命名备忘</span>';
            if (contentEl) contentEl.innerText = note.content || '空内容';
            if (dateEl) dateEl.innerText = formatDate(note.updatedAt);
        }

        // --- 工具函数 ---
        function formatDate(isoString) {
            const date = new Date(isoString);
            const now = new Date();
            if (date.toDateString() === now.toDateString()) {
                return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            }
            return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        }

        function escapeHtml(string) {
            const matchHtmlRegExp = /["'&<>]/;
            const str = '' + string;
            const match = matchHtmlRegExp.exec(str);
            if (!match) return str;
            let escape;
            let html = '';
            let index = 0;
            let lastIndex = 0;
            for (index = match.index; index < str.length; index++) {
                switch (str.charCodeAt(index)) {
                case 34: escape = '&quot;'; break;
                case 38: escape = '&amp;'; break;
                case 39: escape = '&#39;'; break;
                case 60: escape = '&lt;'; break;
                case 62: escape = '&gt;'; break;
                default: continue;
                }
                if (lastIndex !== index) html += str.substring(lastIndex, index);
                lastIndex = index + 1;
                html += escape;
            }
            return lastIndex !== index ? html + str.substring(lastIndex, index) : html;
        }

        // --- 手机扫码同步功能 (方案一: Moo日记互通) ---
        async function openPhoneSyncModal() {
            const modal = document.getElementById('phone-sync-modal');
            modal.classList.remove('hidden');
            lucide.createIcons();

            const activeNote = notes.find(n => n.id === activeNoteId);
            const titleEl = document.getElementById('modal-note-title');
            const wordsEl = document.getElementById('modal-note-words');
            if (activeNote) {
                titleEl.innerText = activeNote.title || '未命名备忘';
                wordsEl.innerText = `${(activeNote.content || '').length} 字`;
            } else {
                titleEl.innerText = '全部备忘录（手机端可自选）';
                wordsEl.innerText = `${notes.filter(n => !n.isDeleted).length} 篇`;
            }

            const qrLoading = document.getElementById('sync-qr-loading');
            qrLoading.style.display = 'flex';

            if (window.sparkBridge && window.sparkBridge.getSyncInfo) {
                try {
                    const info = await window.sparkBridge.getSyncInfo({
                        notes: notes,
                        activeNoteId: activeNoteId
                    });
                    renderSyncInfo(info);
                } catch (err) {
                    console.error('getSyncInfo error:', err);
                    qrLoading.innerHTML = '<span class="text-red-500 text-xs">启动局域网服务失败</span>';
                }
            } else {
                qrLoading.innerHTML = '<span class="text-neutral-400 text-xs">请在桌面客户端中运行此功能</span>';
            }
        }

        function renderSyncInfo(info) {
            const qrImg = document.getElementById('sync-qrcode-img');
            const qrLoading = document.getElementById('sync-qr-loading');
            const urlText = document.getElementById('sync-url-text');
            const ipSelect = document.getElementById('sync-ip-select');

            if (info.qrCodeDataUrl) {
                qrImg.src = info.qrCodeDataUrl;
                qrLoading.style.display = 'none';
            }
            urlText.innerText = info.url;

            ipSelect.innerHTML = '';
            (info.ips || []).forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.address;
                opt.innerText = `${item.name} (${item.address})${item.isRecommended ? ' ★推荐' : ''}`;
                if (item.address === info.selectedIp) {
                    opt.selected = true;
                }
                ipSelect.appendChild(opt);
            });
            lucide.createIcons();
        }

        async function onSyncIpChanged(newIp) {
            if (!newIp || !window.sparkBridge || !window.sparkBridge.changeSyncIp) return;
            const qrLoading = document.getElementById('sync-qr-loading');
            qrLoading.style.display = 'flex';
            try {
                const info = await window.sparkBridge.changeSyncIp(newIp);
                renderSyncInfo(info);
            } catch (err) {
                console.error('changeSyncIp error:', err);
            }
        }

        function closePhoneSyncModal() {
            document.getElementById('phone-sync-modal').classList.add('hidden');
        }

        function handleModalBackdropClick(e) {
            if (e.target.id === 'phone-sync-modal') {
                closePhoneSyncModal();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closePhoneSyncModal();
            }
        });

        function copySyncUrl() {
            const url = document.getElementById('sync-url-text').innerText;
            navigator.clipboard.writeText(url).then(() => {
                const btn = document.getElementById('copy-url-btn-text');
                const orig = btn.innerText;
                btn.innerText = '已复制!';
                setTimeout(() => { btn.innerText = orig; }, 1500);
            });
        }

        // --- 手机扫码接入双重授权 ---
        let pendingAuthRequestId = null;

        if (window.sparkBridge && window.sparkBridge.onAuthRequest) {
            window.sparkBridge.onAuthRequest((data) => {
                pendingAuthRequestId = data.requestId;
                document.getElementById('auth-dev-name').innerText = data.deviceName || '移动设备';
                document.getElementById('auth-dev-ip').innerText = data.ip || '局域网设备';
                document.getElementById('auth-dev-time').innerText = data.time || '刚刚';

                const modal = document.getElementById('device-auth-modal');
                modal.classList.remove('hidden');
                lucide.createIcons();
            });
        }

        async function handleAuthResponse(allow) {
            const modal = document.getElementById('device-auth-modal');
            modal.classList.add('hidden');
            if (!pendingAuthRequestId || !window.sparkBridge || !window.sparkBridge.respondAuth) return;

            try {
                await window.sparkBridge.respondAuth({
                    requestId: pendingAuthRequestId,
                    allow: allow
                });
                pendingAuthRequestId = null;
            } catch (err) {
                console.error('respondAuth error:', err);
            }
        }
    </script>

                    <button onclick="openPreviewImageDefault()" class="px-3 py-1.5 rounded-xl border border-neutral-200 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-700 dark:text-neutral-300 text-xs font-medium transition-all flex items-center space-x-1.5 shadow-xs" title="调用系统默认图片查看器">
                        <i data-lucide="external-link" class="w-3.5 h-3.5 stroke-[1.75]"></i>
                        <span>系统默认看图</span>
                    </button>
                </div>

                <button onclick="removePreviewImage()" class="px-3 py-1.5 rounded-xl text-red-500 hover:bg-red-500/10 text-xs font-medium transition-all flex items-center space-x-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5 stroke-[1.75]"></i>
                    <span>从备忘移除</span>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
