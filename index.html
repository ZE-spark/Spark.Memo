<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark.Memo</title>
    <link rel="icon" type="image/png" href="./assets/icon.png">
    <base href="./">
    <!-- Tailwind CSS -->
    <script src="./assets/tailwind.js"></script>
    <!-- Lucide Icons -->
    <script src="./assets/lucide.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'SF Pro Display', '-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Segoe UI', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 2px 12px rgba(0, 0, 0, 0.03)',
                        'soft-dark': '0 2px 12px rgba(0, 0, 0, 0.2)',
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E5E5E5; border-radius: 99px; }
        .dark ::-webkit-scrollbar-thumb { background: #262626; }
        
        ::selection { background: rgba(23, 23, 23, 0.06); }
        .dark ::selection { background: rgba(255, 255, 255, 0.06); }

        input:focus, textarea:focus, [contenteditable]:focus { outline: none; box-shadow: none !important; }

        /* contenteditable 富文本正文与占位符 */
        #note-content:empty::before,
        #note-content[data-empty="true"]::before {
            content: attr(data-placeholder);
            color: #A3A3A3;
            pointer-events: none;
            display: block;
        }
        html.dark #note-content:empty::before,
        html.dark #note-content[data-empty="true"]::before {
            color: #525252 !important;
        }
        html[data-theme="warm"] #note-content:empty::before,
        html[data-theme="warm"] #note-content[data-empty="true"]::before {
            color: #C8BEAF !important;
        }
        html[data-theme="violet"] #note-content:empty::before,
        html[data-theme="violet"] #note-content[data-empty="true"]::before {
            color: #554E74 !important;
        }
        html[data-theme="teal"] #note-content:empty::before,
        html[data-theme="teal"] #note-content[data-empty="true"]::before {
            color: #42646C !important;
        }

        .note-inline-img-card {
            display: block;
            margin: 14px 0;
            user-select: none;
        }
        .note-inline-img-card img {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }
        .note-inline-img-card img:hover {
            transform: scale(1.008);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            opacity: 0.96;
        }

        .theme-transition, .theme-transition * {
            transition: background-color 0.22s ease, border-color 0.22s ease, opacity 0.22s ease, box-shadow 0.22s ease !important;
        }

        /* ================= 5款主题色调系统 ================= */

        /* 1. 极简纯白 (Light) & 2. 曜石深黑 (Dark) 沿用系统默认原生配置 */

        /* 3. 米黄暖纸 (Warm Cream / 复古护眼 - 参考图1) */
        html[data-theme="warm"] body {
            background-color: #F8F5EE !important;
            color: #2D2825 !important;
        }
        html[data-theme="warm"] aside {
            background-color: #EFE9DE !important;
            border-color: #E2D9CC !important;
        }
        html[data-theme="warm"] main {
            background-color: #FBF9F4 !important;
        }
        html[data-theme="warm"] .border-b,
        html[data-theme="warm"] .border-t,
        html[data-theme="warm"] .border-r,
        html[data-theme="warm"] .border-l {
            border-color: #E4DCCF !important;
        }
        html[data-theme="warm"] #search-input {
            color: #2D2825 !important;
        }
        html[data-theme="warm"] #search-input::placeholder {
            color: #A0978B !important;
        }
        html[data-theme="warm"] .bg-neutral-200\/30 {
            background-color: #E6E0D3 !important;
            border-color: #DDD4C5 !important;
        }
        html[data-theme="warm"] button[id^="tag-filter-"] {
            color: #7A726A !important;
        }
        html[data-theme="warm"] #tag-filter-all.bg-neutral-200\/60 {
            background-color: #E2D8C6 !important;
            color: #2D2825 !important;
        }
        html[data-theme="warm"] input, html[data-theme="warm"] textarea {
            color: #2D2825 !important;
        }
        html[data-theme="warm"] #note-title::placeholder,
        html[data-theme="warm"] #note-content::placeholder {
            color: #C8BEAF !important;
        }
        html[data-theme="warm"] #note-list [id^="sidebar-item-"].bg-white {
            background-color: #FAF6ED !important;
            border-color: #DDD3C2 !important;
            box-shadow: 0 1px 6px rgba(80, 60, 40, 0.05) !important;
        }
        html[data-theme="warm"] #note-list [id^="sidebar-item-"]:hover {
            background-color: #E7E0D3 !important;
        }
        html[data-theme="warm"] .text-neutral-800 {
            color: #2D2825 !important;
        }
        html[data-theme="warm"] .text-neutral-500,
        html[data-theme="warm"] .text-neutral-400 {
            color: #7A726A !important;
        }
        html[data-theme="warm"] ::selection {
            background: #E5DEC5 !important;
        }
        html[data-theme="warm"] ::-webkit-scrollbar-thumb {
            background: #D5CCBA !important;
        }
        html[data-theme="warm"] #theme-menu {
            background-color: #FAF6ED !important;
            border-color: #DDD3C2 !important;
            color: #2D2825 !important;
        }
        html[data-theme="warm"] #theme-menu .theme-option:hover {
            background-color: #EFE8DA !important;
        }
        html[data-theme="warm"] #phone-sync-modal > div > div,
        html[data-theme="warm"] #device-auth-modal > div {
            background-color: #FAF6ED !important;
            border-color: #DDD3C2 !important;
        }

        /* 4. 暮色紫夜 (Lavender Violet / 暗夜极光 - 参考图2) */
        html[data-theme="violet"] body {
            background-color: #161420 !important;
            color: #EAE6F5 !important;
        }
        html[data-theme="violet"] aside {
            background-color: #1E1A2E !important;
            border-color: #2D2644 !important;
        }
        html[data-theme="violet"] main {
            background-color: #181524 !important;
        }
        html[data-theme="violet"] .border-b,
        html[data-theme="violet"] .border-t,
        html[data-theme="violet"] .border-r,
        html[data-theme="violet"] .border-l {
            border-color: #2D2644 !important;
        }
        html[data-theme="violet"] #search-input {
            color: #EDE9F7 !important;
        }
        html[data-theme="violet"] #search-input::placeholder {
            color: #7E789B !important;
        }
        html[data-theme="violet"] .dark\:bg-neutral-800\/30 {
            background-color: #26213A !important;
            border-color: #373054 !important;
        }
        html[data-theme="violet"] button[id^="tag-filter-"] {
            color: #968FA8 !important;
        }
        html[data-theme="violet"] #tag-filter-all.dark\:bg-neutral-800\/60 {
            background-color: #2D2644 !important;
            color: #EDE9F7 !important;
        }
        html[data-theme="violet"] input, html[data-theme="violet"] textarea {
            color: #EDE9F7 !important;
        }
        html[data-theme="violet"] #note-title::placeholder,
        html[data-theme="violet"] #note-content::placeholder {
            color: #554E74 !important;
        }
        html[data-theme="violet"] #note-list [id^="sidebar-item-"].dark\:bg-\[\#1C1C1E\] {
            background-color: #2A2440 !important;
            border-color: #3F3661 !important;
            box-shadow: 0 2px 10px rgba(10, 8, 20, 0.4) !important;
        }
        html[data-theme="violet"] #note-list [id^="sidebar-item-"]:hover {
            background-color: #241F37 !important;
        }
        html[data-theme="violet"] .dark\:text-neutral-200,
        html[data-theme="violet"] .dark\:text-\[\#F5F5F7\] {
            color: #EDE9F7 !important;
        }
        html[data-theme="violet"] .dark\:text-neutral-400,
        html[data-theme="violet"] .dark\:text-neutral-500 {
            color: #968FA8 !important;
        }
        html[data-theme="violet"] ::selection {
            background: #413768 !important;
        }
        html[data-theme="violet"] ::-webkit-scrollbar-thumb {
            background: #393155 !important;
        }
        html[data-theme="violet"] #theme-menu {
            background-color: #231E37 !important;
            border-color: #383056 !important;
            color: #EDE9F7 !important;
        }
        html[data-theme="violet"] #theme-menu .theme-option:hover {
            background-color: #2E2749 !important;
        }
        html[data-theme="violet"] #phone-sync-modal > div > div,
        html[data-theme="violet"] #device-auth-modal > div {
            background-color: #201B33 !important;
            border-color: #383056 !important;
        }

        /* 5. 松石墨青 (Pine Teal / 深海墨翠 - 参考图3) */
        html[data-theme="teal"] body {
            background-color: #0C1619 !important;
            color: #E8F4F2 !important;
        }
        html[data-theme="teal"] aside {
            background-color: #122126 !important;
            border-color: #1A333B !important;
        }
        html[data-theme="teal"] main {
            background-color: #0E1B1F !important;
        }
        html[data-theme="teal"] .border-b,
        html[data-theme="teal"] .border-t,
        html[data-theme="teal"] .border-r,
        html[data-theme="teal"] .border-l {
            border-color: #1A333B !important;
        }
        html[data-theme="teal"] #search-input {
            color: #E8F4F2 !important;
        }
        html[data-theme="teal"] #search-input::placeholder {
            color: #6C939C !important;
        }
        html[data-theme="teal"] .dark\:bg-neutral-800\/30 {
            background-color: #172D35 !important;
            border-color: #244652 !important;
        }
        html[data-theme="teal"] button[id^="tag-filter-"] {
            color: #799DA4 !important;
        }
        html[data-theme="teal"] #tag-filter-all.dark\:bg-neutral-800\/60 {
            background-color: #1D3740 !important;
            color: #E8F4F2 !important;
        }
        html[data-theme="teal"] input, html[data-theme="teal"] textarea {
            color: #E8F4F2 !important;
        }
        html[data-theme="teal"] #note-title::placeholder,
        html[data-theme="teal"] #note-content::placeholder {
            color: #42646C !important;
        }
        html[data-theme="teal"] #note-list [id^="sidebar-item-"].dark\:bg-\[\#1C1C1E\] {
            background-color: #1A343D !important;
            border-color: #264E5B !important;
            box-shadow: 0 2px 10px rgba(5, 15, 20, 0.4) !important;
        }
        html[data-theme="teal"] #note-list [id^="sidebar-item-"]:hover {
            background-color: #162B32 !important;
        }
        html[data-theme="teal"] .dark\:text-neutral-200,
        html[data-theme="teal"] .dark\:text-\[\#F5F5F7\] {
            color: #E8F4F2 !important;
        }
        html[data-theme="teal"] .dark\:text-neutral-400,
        html[data-theme="teal"] .dark\:text-neutral-500 {
            color: #799DA4 !important;
        }
        html[data-theme="teal"] ::selection {
            background: #1F4855 !important;
        }
        html[data-theme="teal"] ::-webkit-scrollbar-thumb {
            background: #254B57 !important;
        }
        html[data-theme="teal"] #theme-menu {
            background-color: #14252B !important;
            border-color: #244652 !important;
            color: #E8F4F2 !important;
        }
        html[data-theme="teal"] #theme-menu .theme-option:hover {
            background-color: #1B353E !important;
        }
        html[data-theme="teal"] #phone-sync-modal > div > div,
        html[data-theme="teal"] #device-auth-modal > div,
        html[data-theme="teal"] #image-preview-modal > div {
            background-color: #13242A !important;
            border-color: #244652 !important;
            color: #E8F4F2 !important;
        }
        html[data-theme="teal"] #font-size-menu {
            background-color: #14252B !important;
            border-color: #244652 !important;
            color: #E8F4F2 !important;
        }

        /* 暮色紫夜 (Violet) 浮层与弹窗适配 */
        html[data-theme="violet"] #image-preview-modal > div {
            background-color: #201B33 !important;
            border-color: #383056 !important;
            color: #EDE9F7 !important;
        }
        html[data-theme="violet"] #font-size-menu {
            background-color: #201B33 !important;
            border-color: #383056 !important;
            color: #EDE9F7 !important;
        }

        /* 米黄暖纸 (Warm) 浮层与弹窗适配 */
        html[data-theme="warm"] #image-preview-modal > div {
            background-color: #FAF6ED !important;
            border-color: #DDD3C2 !important;
            color: #2D2825 !important;
        }
        html[data-theme="warm"] #font-size-menu {
            background-color: #FAF6ED !important;
            border-color: #DDD3C2 !important;
            color: #2D2825 !important;
        }

        /* --- 字号调节面板全主题色彩适配 --- */
        .font-preset-btn {
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #525252;
            background-color: transparent;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .font-preset-btn:hover {
            border-color: #171717 !important;
            color: #171717 !important;
        }
        .font-preset-btn.font-preset-active {
            background-color: #171717 !important;
            border-color: #171717 !important;
            color: #FFFFFF !important;
            font-weight: 600 !important;
        }

        /* 极简深黑 / 默认深色 (Dark) */
        html.dark .font-preset-btn,
        html[data-theme="dark"] .font-preset-btn {
            border-color: rgba(255, 255, 255, 0.12) !important;
            color: #A3A3A3 !important;
        }
        html.dark .font-preset-btn:hover,
        html[data-theme="dark"] .font-preset-btn:hover {
            border-color: #71717A !important;
            color: #FAFAFA !important;
        }
        html.dark .font-preset-btn.font-preset-active,
        html[data-theme="dark"] .font-preset-btn.font-preset-active {
            background-color: #2E2E32 !important;
            border-color: #71717A !important;
            color: #FAFAFA !important;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3) !important;
        }

        /* 米黄暖纸 (Warm) */
        html[data-theme="warm"] .font-preset-btn {
            border-color: #DDD3C2 !important;
            color: #7A726A !important;
        }
        html[data-theme="warm"] .font-preset-btn:hover {
            border-color: #A89B84 !important;
            color: #2D2825 !important;
        }
        html[data-theme="warm"] .font-preset-btn.font-preset-active {
            background-color: #E8DFCF !important;
            border-color: #A89B84 !important;
            color: #2D2825 !important;
            box-shadow: 0 1px 3px rgba(168, 155, 132, 0.2) !important;
        }
        html[data-theme="warm"] #font-size-indicator {
            color: #2D2825 !important;
        }
        html[data-theme="warm"] .font-stepper-wrap {
            background-color: #EFE8DA !important;
        }
        html[data-theme="warm"] .font-stepper-btn {
            background-color: #FAF6ED !important;
            color: #2D2825 !important;
            border: 1px solid #DDD3C2 !important;
        }
        html[data-theme="warm"] .font-stepper-btn:hover {
            background-color: #E5DEC5 !important;
        }
        html[data-theme="warm"] .font-stepper-text {
            color: #7A726A !important;
        }

        /* 暮色紫夜 (Violet) - 完美匹配紫色背景，彻底消除黄色违和感 */
        html[data-theme="violet"] .font-preset-btn {
            border-color: #383056 !important;
            color: #968FA8 !important;
        }
        html[data-theme="violet"] .font-preset-btn:hover {
            border-color: #8B5CF6 !important;
            color: #C4B5FD !important;
            background-color: rgba(139, 92, 246, 0.08) !important;
        }
        html[data-theme="violet"] .font-preset-btn.font-preset-active {
            background-color: #3B315E !important;
            border-color: #8B5CF6 !important;
            color: #EDE9F7 !important;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.25) !important;
        }
        html[data-theme="violet"] #font-size-indicator {
            color: #C4B5FD !important;
        }
        html[data-theme="violet"] .font-stepper-wrap {
            background-color: #26203D !important;
        }
        html[data-theme="violet"] .font-stepper-btn {
            background-color: #342C52 !important;
            color: #EDE9F7 !important;
        }
        html[data-theme="violet"] .font-stepper-btn:hover {
            background-color: #423868 !important;
        }
        html[data-theme="violet"] .font-stepper-text {
            color: #968FA8 !important;
        }
        html[data-theme="violet"] #font-size-btn:hover {
            color: #C4B5FD !important;
        }

        /* 松石墨青 (Teal) - 完美匹配墨青背景 */
        html[data-theme="teal"] .font-preset-btn {
            border-color: #244652 !important;
            color: #799DA4 !important;
        }
        html[data-theme="teal"] .font-preset-btn:hover {
            border-color: #14B8A6 !important;
            color: #5EEAD4 !important;
            background-color: rgba(20, 184, 166, 0.08) !important;
        }
        html[data-theme="teal"] .font-preset-btn.font-preset-active {
            background-color: #1B3D47 !important;
            border-color: #14B8A6 !important;
            color: #E8F4F2 !important;
            box-shadow: 0 0 10px rgba(20, 184, 166, 0.25) !important;
        }
        html[data-theme="teal"] #font-size-indicator {
            color: #5EEAD4 !important;
        }
        html[data-theme="teal"] .font-stepper-wrap {
            background-color: #172D35 !important;
        }
        html[data-theme="teal"] .font-stepper-btn {
            background-color: #1F3C46 !important;
            color: #E8F4F2 !important;
        }
        html[data-theme="teal"] .font-stepper-btn:hover {
            background-color: #274D5A !important;
        }
        html[data-theme="teal"] .font-stepper-text {
            color: #799DA4 !important;
        }
        html[data-theme="teal"] #font-size-btn:hover {
            color: #5EEAD4 !important;
        }

        /* --- 缩略图视窗与拖拽排序 GPU 硬件加速样式 --- */
        #note-images-bar {
            will-change: scroll-position;
            transform: translateZ(0);
            -webkit-overflow-scrolling: touch;
        }
        .image-thumb-card {
            will-change: transform;
            transform: translateZ(0);
            cursor: grab;
            user-select: none;
            transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.16s ease, border-color 0.16s ease, opacity 0.16s ease;
        }
        .image-thumb-card:active {
            cursor: grabbing;
        }
        .thumb-dragging {
            opacity: 0.35 !important;
            transform: scale(0.9) !important;
            border-style: dashed !important;
        }
        .thumb-drop-target {
            transform: scale(1.06) !important;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25) !important;
            border-style: solid !important;
            z-index: 10 !important;
        }

        /* 暮色紫夜主题拖拽高亮 */
        html[data-theme="violet"] .thumb-drop-target {
            border-color: #8B5CF6 !important;
            box-shadow: 0 0 0 2px #8B5CF6, 0 8px 20px rgba(139, 92, 246, 0.4) !important;
        }
        /* 松石墨青主题拖拽高亮 */
        html[data-theme="teal"] .thumb-drop-target {
            border-color: #14B8A6 !important;
            box-shadow: 0 0 0 2px #14B8A6, 0 8px 20px rgba(20, 184, 166, 0.4) !important;
        }
        /* 米黄暖纸主题拖拽高亮 */
        html[data-theme="warm"] .thumb-drop-target {
            border-color: #8C7B65 !important;
            box-shadow: 0 0 0 2px #8C7B65, 0 8px 20px rgba(140, 123, 101, 0.3) !important;
        }
        /* 曜石深黑主题拖拽高亮 */
        html.dark .thumb-drop-target,
        html[data-theme="dark"] .thumb-drop-target {
            border-color: #FAFAFA !important;
            box-shadow: 0 0 0 2px #FAFAFA, 0 8px 20px rgba(255, 255, 255, 0.25) !important;
        }
        /* 极简纯白主题拖拽高亮 */
        html:not(.dark) .thumb-drop-target {
            border-color: #171717 !important;
            box-shadow: 0 0 0 2px #171717, 0 8px 20px rgba(0, 0, 0, 0.25) !important;
        }

        /* --- 右下角字数统计浮标全主题配色适配 --- */
        #word-count-badge {
            background-color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(229, 231, 235, 0.85);
            color: #737373;
            backdrop-filter: blur(8px);
        }
        html.dark #word-count-badge,
        html[data-theme="dark"] #word-count-badge {
            background-color: rgba(28, 28, 30, 0.85) !important;
            border-color: rgba(46, 46, 50, 0.85) !important;
            color: #A1A1AA !important;
        }
        html[data-theme="violet"] #word-count-badge {
            background-color: rgba(32, 27, 51, 0.85) !important;
            border-color: rgba(56, 48, 86, 0.75) !important;
            color: #968FA8 !important;
        }
        html[data-theme="teal"] #word-count-badge {
            background-color: rgba(19, 36, 42, 0.85) !important;
            border-color: rgba(36, 70, 82, 0.75) !important;
            color: #799DA4 !important;
        }
        html[data-theme="warm"] #word-count-badge {
            background-color: rgba(250, 246, 237, 0.9) !important;
            border-color: rgba(221, 211, 194, 0.85) !important;
            color: #7A726A !important;
        }

        /* 顶部原生自适应沉浸式标题栏配色 */
        #window-titlebar {

                                <button onclick="setFontSize(20)" class="font-preset-btn py-1 rounded-md text-center transition-all">20</button>
                                <button onclick="setFontSize(22)" class="font-preset-btn py-1 rounded-md text-center transition-all">22</button>
                                <button onclick="setFontSize(24)" class="font-preset-btn py-1 rounded-md text-center transition-all">24</button>
                                <button onclick="setFontSize(28)" class="font-preset-btn py-1 rounded-md text-center transition-all">28</button>
                            </div>
                        </div>
                    </div>

                    <button id="star-btn" onclick="toggleActiveNoteStar()" class="p-1.5 rounded-md hover:bg-neutral-100 dark:hover:bg-neutral-900 transition-all duration-200 text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-300" title="收藏">
                        <i data-lucide="star" class="w-4 h-4 stroke-[1.5]"></i>
                    </button>
                    <button onclick="deleteActiveNote()" class="p-1.5 rounded-md hover:bg-red-500/5 text-neutral-400 hover:text-red-500 dark:hover:text-red-400 transition-all duration-200" title="删除">
                        <i data-lucide="trash-2" class="w-4 h-4 stroke-[1.5]"></i>
                    </button>
                </div>
            </div>

            <!-- 回收站高级提示横幅 (Linear 灵感微光通知) -->
            <div id="trash-banner" class="hidden bg-amber-500/[0.04] border-b border-amber-500/10 text-amber-600 dark:text-amber-500/90 text-[12px] py-2 px-6 flex justify-between items-center select-none flex-shrink-0 w-full min-w-0">
                <span class="flex items-center space-x-2">
                    <i data-lucide="info" class="w-3.5 h-3.5 stroke-[1.5]"></i>
                    <span id="trash-banner-text">此备忘录已在回收站中。</span>
                </span>
                <div class="flex items-center space-x-4">
                    <button onclick="restoreActiveNote()" class="hover:underline font-medium flex items-center space-x-1">
                        <i data-lucide="rotate-ccw" class="w-3 h-3 stroke-[2]"></i><span>恢复内容</span>
                    </button>
                    <button onclick="deleteActiveNote()" class="text-red-500 dark:text-red-400 hover:underline font-medium flex items-center space-x-1">
                        <i data-lucide="x" class="w-3 h-3 stroke-[2]"></i><span>彻底删除</span>
                    </button>
                </div>
            </div>

            <!-- 核心沉浸式文本区域 (自适应宽度，优雅呼吸感，彻底杜绝内容截断) -->
            <div class="flex-1 min-w-0 overflow-y-auto px-6 sm:px-10 md:px-14 lg:px-16 pt-7 pb-12 max-w-4xl w-full mx-auto flex flex-col space-y-4">
                <input id="note-title" type="text" placeholder="未命名备忘" oninput="saveCurrentState()"
                    class="w-full min-w-0 text-2xl md:text-3xl font-semibold tracking-tight bg-transparent text-[#171717] dark:text-[#F5F5F7] placeholder-neutral-200 dark:placeholder-neutral-800/80 disabled:opacity-60 disabled:cursor-not-allowed outline-none">
                
                <!-- 正文上方图片缩略图排（支持横向滑动、点击查看大图、删除、零额外存储占用、限制在父容器内） -->
                <div id="note-images-bar" class="hidden flex items-center space-x-3 overflow-x-auto py-2.5 px-0.5 scrollbar-thin select-none w-full max-w-full min-w-0">
                    <!-- 缩略图由 JS 动态渲染 -->
                </div>

                <textarea id="note-content" placeholder="开始构思你的想法..." oninput="saveCurrentState()"
                    class="w-full min-w-0 flex-1 text-[15px] md:text-[16px] leading-relaxed bg-transparent text-neutral-800 dark:text-neutral-200 placeholder-neutral-200 dark:placeholder-neutral-800/80 resize-none pb-20 disabled:opacity-60 disabled:cursor-not-allowed outline-none break-words whitespace-pre-wrap"></textarea>
            </div>

            <!-- 右下角字数统计浮标 (极简优雅，跟随主题) -->
            <div id="word-count-badge" class="absolute bottom-5 right-7 z-20 pointer-events-none select-none px-2.5 py-1 rounded-full text-[11px] font-mono tracking-wide shadow-xs transition-all duration-200 flex items-center space-x-1">
                <span id="word-count-text">0字</span>
            </div>
        </div>
    </main>
    </div>

    <script>
        // --- 核心状态 ---
        let notes = JSON.parse(localStorage.getItem('memos_data')) || [];
        let activeNoteId = localStorage.getItem('memos_active_id') || null;
        let currentSearchQuery = '';
        let currentFilterTag = 'all'; // 'all', '工作', '生活', '灵感', 'trash'
        let isSelectionMode = false;
        let selectedNoteIds = new Set();
        let isSidebarCollapsed = localStorage.getItem('memos_sidebar_collapsed') === 'true';

        const tagColors = {
            '工作': 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/10',
            '生活': 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/10',
            '灵感': 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/10',
        };

        // --- 侧边栏折叠/展开系统 ---
        function toggleSidebar() {
            isSidebarCollapsed = !isSidebarCollapsed;
            applySidebarState();
            localStorage.setItem('memos_sidebar_collapsed', isSidebarCollapsed);
        }

        function applySidebarState() {
            const sidebar = document.getElementById('app-sidebar');
            const expandBtn = document.getElementById('sidebar-expand-btn');
            const emptyExpandBtn = document.getElementById('empty-sidebar-expand-btn');
            if (!sidebar) return;

            if (isSidebarCollapsed) {
                sidebar.classList.add('sidebar-collapsed');
                if (expandBtn) expandBtn.classList.remove('hidden');
                if (emptyExpandBtn) emptyExpandBtn.classList.remove('hidden');
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                if (expandBtn) expandBtn.classList.add('hidden');
                if (emptyExpandBtn) emptyExpandBtn.classList.add('hidden');
            }
        }

        // --- 初始化应用 ---
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initFontSize();
            initNoteImagesBarWheel();
            applySidebarState();
            purgeOldDeletedNotes(); // 启动无感清空过期碎片
            renderSidebar();
            if (activeNoteId && notes.find(n => n.id === activeNoteId)) {
                switchActiveNote(activeNoteId);
            } else {
                showEmptyState();
            }
            if (window.sparkBridge && window.sparkBridge.updateSyncData) {
                window.sparkBridge.updateSyncData({ notes, activeNoteId });
            }
            lucide.createIcons();
        });

        // --- 主题控制 ---
        // --- 5款精选颜色模式与主题管理系统 ---
        const themeTitleBarColors = {
            light: { color: '#FAFAFA', symbolColor: '#525252' },
            dark: { color: '#0A0A0A', symbolColor: '#A3A3A3' },
            warm: { color: '#F8F5EE', symbolColor: '#78716C' },
            violet: { color: '#161420', symbolColor: '#A78BFA' },
            teal: { color: '#0C1619', symbolColor: '#2DD4BF' }
        };

        function initTheme() {
            let savedTheme = localStorage.getItem('memos_theme');
            if (!savedTheme) {
                savedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            setTheme(savedTheme);
        }

        function setTheme(themeName) {
            const validThemes = ['light', 'dark', 'warm', 'violet', 'teal'];
            if (!validThemes.includes(themeName)) themeName = 'light';

            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('memos_theme', themeName);

            // 深色系主题保留 dark 类以维持基础对比度与表单高反差
            if (['dark', 'violet', 'teal'].includes(themeName)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            // 同步更新原生窗口标题栏与控制按钮配色
            if (window.sparkBridge && window.sparkBridge.setTitleBarTheme) {
                const colors = themeTitleBarColors[themeName] || themeTitleBarColors.light;
                window.sparkBridge.setTitleBarTheme(colors);
            }

            updateThemeMenuUI(themeName);
            renderSidebar();
            if (window.lucide) lucide.createIcons();

            const menu = document.getElementById('theme-menu');
            if (menu) menu.classList.add('hidden');
        }

        function toggleThemeMenu(e) {
            if (e) e.stopPropagation();
            const menu = document.getElementById('theme-menu');
            if (menu) {
                menu.classList.toggle('hidden');
            }
        }

        function updateThemeMenuUI(themeName) {
            document.querySelectorAll('.theme-option').forEach(el => {
                const val = el.getAttribute('data-theme-val');
                const check = el.querySelector('.theme-check');
                if (val === themeName) {
                    el.classList.add('bg-neutral-100', 'dark:bg-neutral-800/80', 'font-semibold');
                    if (check) check.classList.remove('hidden');
                } else {
                    el.classList.remove('bg-neutral-100', 'dark:bg-neutral-800/80', 'font-semibold');
                    if (check) check.classList.add('hidden');
                }
            });
        }

        // 全局点击监听：收起色彩模式选择下拉与字号调节下拉
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('theme-menu');
            const btn = document.getElementById('theme-btn');
            if (menu && !menu.classList.contains('hidden')) {
                if (!menu.contains(e.target) && (!btn || !btn.contains(e.target))) {
                    menu.classList.add('hidden');
                }
            }

            const fontMenu = document.getElementById('font-size-menu');
            const fontBtn = document.getElementById('font-size-btn');
            if (fontMenu && !fontMenu.classList.contains('hidden')) {
                if (!fontMenu.contains(e.target) && (!fontBtn || !fontBtn.contains(e.target))) {
                    fontMenu.classList.add('hidden');
                }
            }
        });

        // --- 正文字号调节系统 ---
        let currentFontSize = parseInt(localStorage.getItem('memos_editor_font_size')) || 16;

        function initFontSize() {
            applyFontSize(currentFontSize);
        }

        function applyFontSize(size) {
            if (isNaN(size) || size < 12) size = 12;
            if (size > 36) size = 36;
            currentFontSize = size;
            localStorage.setItem('memos_editor_font_size', size);

            const content = document.getElementById('note-content');
            if (content) {
                content.style.fontSize = size + 'px';
                content.style.lineHeight = (size <= 15 ? '1.75' : size <= 20 ? '1.7' : '1.6');
            }

            const label = document.getElementById('font-size-label');
            if (label) label.innerText = `${size}px`;

            const indicator = document.getElementById('font-size-indicator');
            if (indicator) indicator.innerText = `${size}px`;

            // 预设按钮激活态高亮 (主题色彩自适应，去除突兀黄色)
            document.querySelectorAll('.font-preset-btn').forEach(btn => {
                const val = parseInt(btn.innerText);
                btn.classList.toggle('font-preset-active', val === size);
            });
        }

        function setFontSize(size) {
            applyFontSize(size);
        }

        function changeFontSize(delta) {
            applyFontSize(currentFontSize + delta);
        }

        function toggleFontSizeMenu(e) {
            if (e) e.stopPropagation();
            const menu = document.getElementById('font-size-menu');
            if (menu) {
                menu.classList.toggle('hidden');
            }
            // 互斥收起主题下拉
            const themeMenu = document.getElementById('theme-menu');
            if (themeMenu) themeMenu.classList.add('hidden');
        }

        // --- 本地图片管理系统 (只加顶部缩略图，不加正文，零额外存储占用，可放大浏览) ---
        let currentPreviewingIndex = -1;
        let previewZoomScale = 1;
        let previewTranslateX = 0;
        let previewTranslateY = 0;
        let isPointerDown = false;
        let isDraggingPreview = false;
        let startPointerX = 0;
        let startPointerY = 0;
        let startTranslateX = 0;
        let startTranslateY = 0;

        function formatFileSize(bytes) {
            if (!bytes || bytes === 0) return '';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        async function startInsertImageFlow() {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (!note || note.isDeleted) return;

            if (!window.sparkBridge || !window.sparkBridge.selectImages) {
                alert('当前运行环境不支持打开本地文件选择框');
                return;
            }

            try {
                const files = await window.sparkBridge.selectImages();
                if (!files || files.length === 0) return;

                if (!Array.isArray(note.images)) {
                    note.images = [];
                }

                files.forEach(f => {
                    note.images.push({
                        id: 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                        path: f.path,
                        fileUrl: f.fileUrl,
                        name: f.name,
                        size: f.size,
                        addedAt: new Date().toISOString()
                    });
                });

                note.updatedAt = new Date().toISOString();
                saveDataToStorage();
                renderNoteImages();
            } catch (err) {
                console.error('选取本地图片失败:', err);
            }
        }

        // --- 缩略图拖拽排序逻辑 ---
        let draggedThumbIndex = null;
        let currentDropTargetIndex = null;
        let isThumbDragging = false;

        function handleThumbDragStart(e, idx) {
            draggedThumbIndex = idx;
            isThumbDragging = true;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', String(idx));
            const card = e.currentTarget;
            if (card) {
                setTimeout(() => {
                    if (isThumbDragging) card.classList.add('thumb-dragging');
                }, 0);
            }
        }

        function handleThumbDragOver(e, idx) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (currentDropTargetIndex !== idx) {
                currentDropTargetIndex = idx;
                renderThumbDropIndicators();
            }
        }

        function handleThumbDragLeave(e, idx) {
            if (currentDropTargetIndex === idx) {
                currentDropTargetIndex = null;
                renderThumbDropIndicators();
            }
        }

        function handleThumbDrop(e, targetIdx) {
            e.preventDefault();
            if (draggedThumbIndex === null || draggedThumbIndex === undefined) return;
            const fromIdx = draggedThumbIndex;
            handleThumbDragEnd(e);
            if (fromIdx !== targetIdx) {
                reorderNoteImages(fromIdx, targetIdx);
            }
        }

        function handleThumbDragOverEnd(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (currentDropTargetIndex !== 'end') {
                currentDropTargetIndex = 'end';
                renderThumbDropIndicators();
            }
        }

        function handleThumbDragLeaveEnd(e) {
            if (currentDropTargetIndex === 'end') {
                currentDropTargetIndex = null;
                renderThumbDropIndicators();
            }
        }

        function handleThumbDropEnd(e) {
            e.preventDefault();
            if (draggedThumbIndex === null || draggedThumbIndex === undefined) return;
            const fromIdx = draggedThumbIndex;
            handleThumbDragEnd(e);
            moveNoteImageToEnd(fromIdx);
        }

        function handleThumbDragEnd(e) {
            draggedThumbIndex = null;
            currentDropTargetIndex = null;
            document.querySelectorAll('.image-thumb-card').forEach(card => {
                card.classList.remove('thumb-dragging', 'thumb-drop-target');
            });
            const addBtn = document.getElementById('add-image-thumb-btn');
            if (addBtn) addBtn.classList.remove('thumb-drop-target');
            setTimeout(() => {
                isThumbDragging = false;
            }, 80);
        }

        function renderThumbDropIndicators() {
            document.querySelectorAll('.image-thumb-card').forEach(card => {
                const idx = parseInt(card.getAttribute('data-thumb-idx'));
                if (idx === currentDropTargetIndex && idx !== draggedThumbIndex) {
                    card.classList.add('thumb-drop-target');
                } else {
                    card.classList.remove('thumb-drop-target');
                }
            });
            const addBtn = document.getElementById('add-image-thumb-btn');
            if (addBtn) {
                if (currentDropTargetIndex === 'end' && draggedThumbIndex !== null) {
                    addBtn.classList.add('thumb-drop-target');
                } else {
                    addBtn.classList.remove('thumb-drop-target');
                }
            }
        }

        function reorderNoteImages(fromIdx, toIdx) {
            if (!activeNoteId || fromIdx === toIdx) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (!note || !Array.isArray(note.images)) return;
            if (fromIdx < 0 || toIdx < 0 || fromIdx >= note.images.length || toIdx >= note.images.length) return;

            const [moved] = note.images.splice(fromIdx, 1);
            note.images.splice(toIdx, 0, moved);
            note.updatedAt = new Date().toISOString();
            saveDataToStorage();
            renderNoteImages();
        }

        function moveNoteImageToEnd(fromIdx) {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (!note || !Array.isArray(note.images)) return;
            if (fromIdx < 0 || fromIdx >= note.images.length) return;
            if (fromIdx === note.images.length - 1) return;

            const [moved] = note.images.splice(fromIdx, 1);
            note.images.push(moved);
            note.updatedAt = new Date().toISOString();
            saveDataToStorage();
            renderNoteImages();
        }

        function renderNoteImages() {
            const bar = document.getElementById('note-images-bar');
            if (!bar) return;

            if (!activeNoteId) {
                bar.classList.add('hidden');
                bar.innerHTML = '';
                return;
            }

            const note = notes.find(n => n.id === activeNoteId);
            if (!note || !Array.isArray(note.images) || note.images.length === 0) {
                bar.classList.add('hidden');
                bar.innerHTML = '';
                return;
            }

            bar.classList.remove('hidden');

            let html = note.images.map((img, idx) => `
                <div class="image-thumb-card group relative flex-shrink-0 w-24 h-24 rounded-2xl overflow-hidden border border-neutral-200/80 dark:border-neutral-800 bg-neutral-100 dark:bg-neutral-900 cursor-grab active:cursor-grabbing shadow-xs hover:shadow-md select-none"
                    draggable="${!note.isDeleted ? 'true' : 'false'}"
                    data-thumb-idx="${idx}"
                    ondragstart="handleThumbDragStart(event, ${idx})"
                    ondragover="handleThumbDragOver(event, ${idx})"
                    ondragleave="handleThumbDragLeave(event, ${idx})"
                    ondrop="handleThumbDrop(event, ${idx})"
                    ondragend="handleThumbDragEnd(event)"
                    onclick="openImagePreview(${idx})"
                    title="${!note.isDeleted ? '拖拽可调整图片顺序 · 点击放大查看' : '点击放大查看'}">
                    <img src="${img.fileUrl}" class="w-full h-full object-cover pointer-events-none select-none" draggable="false" onerror="this.src='./assets/icon.png';" alt="${img.name}">
                    
                    <!-- 序号角标 (高性能无模糊渲染) -->
                    <span class="absolute bottom-1.5 left-2 px-1.5 py-0.5 rounded-md bg-black/75 text-[10px] text-white/95 font-mono font-medium shadow-xs select-none pointer-events-none">${idx + 1}</span>

                    <div class="absolute inset-0 bg-black/35 opacity-0 group-hover:opacity-100 transition-opacity flex items-start justify-between p-1.5 pointer-events-none">
                        ${!note.isDeleted ? `
                        <div class="w-5 h-5 rounded-full bg-black/50 text-white/90 flex items-center justify-center text-[10px] shadow" title="按住拖拽排序">
                            <i data-lucide="grip-vertical" class="w-3 h-3 stroke-[2]"></i>
                        </div>
                        <button onclick="event.stopPropagation(); removeImageFromNote(${idx})" class="w-5 h-5 rounded-full bg-red-500/90 hover:bg-red-600 text-white flex items-center justify-center transition-all shadow hover:scale-110 pointer-events-auto" title="从备忘移除">
                            <i data-lucide="x" class="w-3 h-3 stroke-[2.5]"></i>
                        </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            if (!note.isDeleted) {
                html += `
                    <button id="add-image-thumb-btn"
                        onclick="startInsertImageFlow()"
                        ondragover="handleThumbDragOverEnd(event)"
                        ondragleave="handleThumbDragLeaveEnd(event)"
                        ondrop="handleThumbDropEnd(event)"
                        class="flex-shrink-0 w-24 h-24 rounded-2xl border-2 border-dashed border-neutral-300 dark:border-neutral-700 hover:border-violet-500/60 dark:hover:border-violet-400/60 hover:bg-neutral-500/5 flex flex-col items-center justify-center text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-300 transition-all text-xs space-y-1 select-none" title="添加图片 / 拖拽到此移至末尾">
                        <i data-lucide="plus" class="w-5 h-5 stroke-[2]"></i>
                        <span class="text-[10px] font-medium">添加图片</span>
                    </button>
                `;
            }

            bar.innerHTML = html;
            if (window.lucide) lucide.createIcons();
            initNoteImagesBarWheel();
        }

        // --- 缩略图视窗原生级丝滑平滑滚动系统 (Native-smooth Lerp Engine) ---
        let thumbTargetScroll = 0;
        let thumbCurrentScroll = 0;
        let isThumbScrolling = false;
        let thumbRafId = null;

        function initNoteImagesBarWheel() {
            const bar = document.getElementById('note-images-bar');
            if (!bar || bar._wheelInited) return;
            bar._wheelInited = true;

            // 监听滚轮事件，实时计算目标位置
            bar.addEventListener('wheel', (e) => {
                const maxScroll = bar.scrollWidth - bar.clientWidth;
                if (maxScroll <= 0) return;
                e.preventDefault();

                let delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
                if (e.deltaMode === 1) delta *= 36;
                else if (e.deltaMode === 2) delta *= bar.clientWidth;

                // 触控板检测：高频小数或微小步进，直接 1:1 无感直通
                const isTouchpad = Math.abs(delta) < 30 && !Number.isInteger(delta / 10);
                if (isTouchpad) {
                    bar.scrollLeft += delta;
                    thumbTargetScroll = bar.scrollLeft;
                    thumbCurrentScroll = bar.scrollLeft;
                    isThumbScrolling = false;
                    if (thumbRafId) cancelAnimationFrame(thumbRafId);
                    thumbRafId = null;
                    return;
                }

                // 物理鼠标滚轮：模拟正文 Chromium 原生丝滑滚动
                if (!isThumbScrolling) {
                    thumbTargetScroll = bar.scrollLeft;
                    thumbCurrentScroll = bar.scrollLeft;
                }

                // 每格滚轮平滑推进约 1.2 个卡片宽度（~130px），与正文行进手感完全契合
                const step = (delta > 0 ? 1 : -1) * Math.max(120, Math.abs(delta) * 1.2);
                thumbTargetScroll = Math.max(0, Math.min(maxScroll, thumbTargetScroll + step));

                if (!isThumbScrolling) {
                    isThumbScrolling = true;
                    thumbRafId = requestAnimationFrame(renderThumbSmoothScroll);
                }
            }, { passive: false });

            // 用户手动交互（点击、拖拽卡片、滚动条）立刻对齐目标
            const syncImmediate = () => {
                isThumbScrolling = false;
                if (thumbRafId) cancelAnimationFrame(thumbRafId);
                thumbRafId = null;
                thumbTargetScroll = bar.scrollLeft;
                thumbCurrentScroll = bar.scrollLeft;
            };
            bar.addEventListener('mousedown', syncImmediate);
            bar.addEventListener('pointerdown', syncImmediate);
            bar.addEventListener('scroll', () => {
                if (!isThumbScrolling) {
                    thumbTargetScroll = bar.scrollLeft;
                    thumbCurrentScroll = bar.scrollLeft;
                }
            }, { passive: true });
        }

        function renderThumbSmoothScroll() {
            if (!isThumbScrolling) return;
            const bar = document.getElementById('note-images-bar');
            if (!bar) {
                isThumbScrolling = false;
                thumbRafId = null;
                return;
            }

            const diff = thumbTargetScroll - thumbCurrentScroll;
            if (Math.abs(diff) > 0.4) {
                // 缓动插值系数 0.15：拥有完全一致的加速与软着陆减速曲线，绝对不卡顿
                thumbCurrentScroll += diff * 0.15;
                bar.scrollLeft = thumbCurrentScroll;
                thumbRafId = requestAnimationFrame(renderThumbSmoothScroll);
            } else {
                bar.scrollLeft = thumbTargetScroll;
                thumbCurrentScroll = thumbTargetScroll;
                isThumbScrolling = false;
                thumbRafId = null;
            }
        }

        function removeImageFromNote(index) {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (!note || !Array.isArray(note.images)) return;

            note.images.splice(index, 1);
            note.updatedAt = new Date().toISOString();
            saveDataToStorage();
            renderNoteImages();
        }

        function openImagePreview(index) {
            if (isThumbDragging) return; // 拖动调序时松手不误开预览弹窗
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (!note || !Array.isArray(note.images) || !note.images[index]) return;

            currentPreviewingIndex = index;
            const img = note.images[index];

            const modal = document.getElementById('image-preview-modal');
            document.getElementById('preview-image-name').innerText = img.name || '图片详情';
            document.getElementById('preview-image-size').innerText = formatFileSize(img.size);
            const elem = document.getElementById('preview-image-elem');
            elem.src = img.fileUrl;

            resetPreviewZoom();

            modal.classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        }

        function closeImagePreviewModal() {
            const modal = document.getElementById('image-preview-modal');
            if (modal) modal.classList.add('hidden');
            currentPreviewingIndex = -1;
            resetPreviewZoom();
        }

        function resetPreviewZoom() {
            previewZoomScale = 1;
            previewTranslateX = 0;
            previewTranslateY = 0;
            isPointerDown = false;
            isDraggingPreview = false;
            updatePreviewTransform();
        }

        function zoomPreview(delta, clientX, clientY) {
            const oldScale = previewZoomScale;
            let newScale = Math.round((oldScale + delta) * 100) / 100;
            if (newScale < 0.4) newScale = 0.4;
            if (newScale > 5.0) newScale = 5.0;
            if (newScale === oldScale) return;

            const viewport = document.getElementById('preview-image-viewport');
            if (viewport && clientX !== undefined && clientY !== undefined && newScale > 1.0) {
                const rect = viewport.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const ox = clientX - cx;
                const oy = clientY - cy;

                const ratio = newScale / oldScale;
                previewTranslateX = ox - (ox - previewTranslateX) * ratio;
                previewTranslateY = oy - (oy - previewTranslateY) * ratio;
            } else if (newScale <= 1.0) {
                previewTranslateX = 0;
                previewTranslateY = 0;
            } else if (viewport) {
                const ratio = newScale / oldScale;
                previewTranslateX = previewTranslateX * ratio;
                previewTranslateY = previewTranslateY * ratio;
            }

            previewZoomScale = newScale;
            updatePreviewTransform();
        }

        function updatePreviewTransform() {
            const img = document.getElementById('preview-image-elem');
            const badge = document.getElementById('preview-zoom-badge');
            const viewport = document.getElementById('preview-image-viewport');
            if (img) {
                img.style.transform = `translate(${previewTranslateX}px, ${previewTranslateY}px) scale(${previewZoomScale})`;
                img.style.transition = isDraggingPreview ? 'none' : 'transform 0.12s ease-out';
            }
            if (viewport) {
                if (isDraggingPreview) {
                    viewport.style.cursor = 'grabbing';
                } else if (previewZoomScale > 1.05) {
                    viewport.style.cursor = 'grab';
                } else {
                    viewport.style.cursor = 'default';
                }
            }
            if (badge) {
                badge.innerText = `${Math.round(previewZoomScale * 100)}%`;
            }
        }

        function openPreviewImageInFolder() {
            if (!activeNoteId || currentPreviewingIndex < 0) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (!note || !note.images || !note.images[currentPreviewingIndex]) return;

            const img = note.images[currentPreviewingIndex];
            if (window.sparkBridge && window.sparkBridge.showInFolder) {
                window.sparkBridge.showInFolder(img.path);
            }
        }

        function openPreviewImageDefault() {
            if (!activeNoteId || currentPreviewingIndex < 0) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (!note || !note.images || !note.images[currentPreviewingIndex]) return;

        function removePreviewImage() {

        // 初始化图片缩放与交互系统
        window.addEventListener('load', () => {
            const viewport = document.getElementById('preview-image-viewport');
            const imgElem = document.getElementById('preview-image-elem');
            const previewModal = document.getElementById('image-preview-modal');

            if (previewModal) {
                previewModal.addEventListener('click', (e) => {
                    if (e.target.id === 'image-preview-modal') closeImagePreviewModal();
                });
            }

            if (viewport && imgElem) {
                // 滚轮缩放：以鼠标当前光标位置为中心进行平滑等比缩放
                viewport.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const delta = e.deltaY < 0 ? 0.25 : -0.25;
                    zoomPreview(delta, e.clientX, e.clientY);
                    if (isPointerDown) {
                        startPointerX = e.clientX;
                        startPointerY = e.clientY;
                        startTranslateX = previewTranslateX;
                        startTranslateY = previewTranslateY;
                    }
                }, { passive: false });

                // 鼠标左键按下：准备拖动，按住并移动时才进入平移状态
                viewport.addEventListener('pointerdown', (e) => {
                    if (e.button !== 0) return; // 严格仅响应鼠标主键（左键）
                    if (e.target.closest('button')) return;
                    e.preventDefault();

                    isPointerDown = true;
                    isDraggingPreview = false;
                    startPointerX = e.clientX;
                    startPointerY = e.clientY;
                    startTranslateX = previewTranslateX;
                    startTranslateY = previewTranslateY;

                    try {
                        viewport.setPointerCapture(e.pointerId);
                    } catch (err) {}
                });

                // 鼠标移动：必须物理按住鼠标左键并且发生实质位移才移动图片
                viewport.addEventListener('pointermove', (e) => {
                    if (!isPointerDown) return;

                    // 实时硬件按键检测：若左键未按住（e.buttons 的 bit 0 为 0），立即终止拖拽
                    if ((e.buttons & 1) !== 1) {
                        isPointerDown = false;
                        isDraggingPreview = false;
                        updatePreviewTransform();
                        return;
                    }

                    const dx = e.clientX - startPointerX;
                    const dy = e.clientY - startPointerY;

                    // 死区阈值：位移大于 3px 才激活移动，普通点按绝不跟随
                    if (!isDraggingPreview && Math.hypot(dx, dy) > 3) {
                        isDraggingPreview = true;
                    }

                    if (isDraggingPreview) {
                        previewTranslateX = startTranslateX + dx;
                        previewTranslateY = startTranslateY + dy;
                        updatePreviewTransform();
                    }
                });

                // 鼠标松开或取消：立刻彻底释放拖拽，杜绝吸附游走
                const endPointerDrag = (e) => {
                    if (!isPointerDown) return;
                    isPointerDown = false;
                    isDraggingPreview = false;
                    try {
                        if (viewport.hasPointerCapture && viewport.hasPointerCapture(e.pointerId)) {
                            viewport.releasePointerCapture(e.pointerId);
                        }
                    } catch (err) {}
                    updatePreviewTransform();
                };

                viewport.addEventListener('pointerup', endPointerDrag);
                viewport.addEventListener('pointercancel', endPointerDrag);

                // 全局兜底：窗口失焦或全局鼠标释放时强行停止
                window.addEventListener('mouseup', () => {
                    if (isPointerDown || isDraggingPreview) {
                        isPointerDown = false;
                        isDraggingPreview = false;
                        updatePreviewTransform();
                    }
                });
                window.addEventListener('blur', () => {
                    isPointerDown = false;
                    isDraggingPreview = false;
                    updatePreviewTransform();
                });

                // 阻止任何原生浏览器图片幽灵拖拽
                viewport.addEventListener('dragstart', (e) => e.preventDefault());
                imgElem.addEventListener('dragstart', (e) => e.preventDefault());

                // 双击放大/还原（以光标所在位置为中心放大到 2.0x，再次双击还原）
                viewport.addEventListener('dblclick', (e) => {
                    if (e.target.closest('button')) return;
                    e.stopPropagation();
                    if (previewZoomScale > 1.1) {
                        resetPreviewZoom();
                    } else {
                        zoomPreview(2.0 - previewZoomScale, e.clientX, e.clientY);
                    }
                });
            }

            // 全局快捷键
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeImagePreviewModal();
                }
                // Ctrl+\ 或 Cmd+\ 快捷折叠/展开侧边栏
                if ((e.ctrlKey || e.metaKey) && e.key === '\\') {
                    e.preventDefault();
                    toggleSidebar();
                }
            });
        });

        // --- 核心清理机制（30天自动销毁） ---
        function purgeOldDeletedNotes() {
            const thirtyDaysInMs = 30 * 24 * 60 * 60 * 1000;
            const now = Date.now();
            let hasChanged = false;

            notes = notes.filter(note => {
                if (note.isDeleted && note.deletedAt) {
                    const elapsed = now - new Date(note.deletedAt).getTime();
                    if (elapsed > thirtyDaysInMs) {
                        hasChanged = true;
                        return false; // 超过30天，彻底从物理存储中抹除
                    }
                }
                return true;
            });

            if (hasChanged) saveDataToStorage();
        }

        // --- 数据操作层 ---
        function createNewNote() {
            // 如果在回收站视图，点击新建需要强制切回常规全部视图
            if (currentFilterTag === 'trash') {
                filterByTag('all');
            }

            // 新建备忘时退出多选模式
            if (isSelectionMode) exitSelectionMode();

            const newNote = {
                id: 'note_' + Date.now(),
                title: '',
                content: '',
                tag: '',
                images: [],
                isStarred: false,
                isDeleted: false,
                deletedAt: null,
                updatedAt: new Date().toISOString()
            };
            notes.unshift(newNote);
            saveDataToStorage();
            switchActiveNote(newNote.id);
            renderSidebar();
            document.getElementById('note-title').focus();
        }

        function switchActiveNote(id) {
            activeNoteId = id;
            localStorage.setItem('memos_active_id', id);
            
            if (window.sparkBridge && window.sparkBridge.updateSyncData) {
                window.sparkBridge.updateSyncData({ notes, activeNoteId: id });
            }
            
            const note = notes.find(n => n.id === id);
            if (!note) return showEmptyState();

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('editor-container').classList.remove('hidden');

            // 填充表单 (过滤清除可能残存的图片路径标记，确保正文纯净排版)
            document.getElementById('note-title').value = note.title || '';
            const rawContent = note.content || '';
            const cleanContent = rawContent.replace(/!\[([^\]]*)\]\([^\)]+\)\s*/g, '').trim();
            if (cleanContent !== rawContent) {
                note.content = cleanContent;
                saveDataToStorage();
            }
            document.getElementById('note-content').value = cleanContent;
            document.getElementById('editor-date').innerText = `更新于：${formatDate(note.updatedAt)}`;

            // 处理回收站的只读约束与横幅提醒
            const titleInput = document.getElementById('note-title');
            const contentInput = document.getElementById('note-content');
            const trashBanner = document.getElementById('trash-banner');
            const toolsBar = document.getElementById('editor-tools');
            const tagsBar = document.getElementById('editor-tags-bar');

            if (note.isDeleted) {
                // 1. 计算过期剩余天数
                const thirtyDaysInMs = 30 * 24 * 60 * 60 * 1000;
                const elapsed = Date.now() - new Date(note.deletedAt).getTime();
                const daysLeft = Math.max(1, Math.ceil((thirtyDaysInMs - elapsed) / (24 * 60 * 60 * 1000)));
                
                document.getElementById('trash-banner-text').innerText = `此备忘录已在回收站中，将于 ${daysLeft} 天后被永久清空。`;
                trashBanner.classList.remove('hidden');
                
                // 2. 冻结编辑状态
                titleInput.disabled = true;
                contentInput.disabled = true;
                toolsBar.classList.add('opacity-0', 'pointer-events-none');
                tagsBar.classList.add('opacity-0', 'pointer-events-none');
            } else {
                trashBanner.classList.add('hidden');
                titleInput.disabled = false;
                contentInput.disabled = false;
                toolsBar.classList.remove('opacity-0', 'pointer-events-none');
                tagsBar.classList.remove('opacity-0', 'pointer-events-none');
            }

            // 同步星标状态
            const starBtn = document.getElementById('star-btn');
            if (note.isStarred) {
                starBtn.innerHTML = `<i data-lucide="star" class="w-4 h-4 fill-amber-400 stroke-amber-400"></i>`;
            } else {
                starBtn.innerHTML = `<i data-lucide="star" class="w-4 h-4 stroke-[1.5]"></i>`;
            }

            // 同步标签激活状态
            ['工作', '生活', '灵感'].forEach(t => {
                const btn = document.getElementById(`note-tag-${t}`);
                btn.className = "px-2 py-0.5 rounded text-xs transition-all duration-200 " + 
                    (note.tag === t ? `${tagColors[t]} font-medium` : "text-neutral-400 dark:text-neutral-500 hover:bg-neutral-100 dark:hover:bg-neutral-900");
            });

            renderNoteImages();
            updateWordCount();
            renderSidebar();
            lucide.createIcons();
        }

        // --- 实时字数统计系统 (显示格式为“XXXX字”，极简优雅且全主题自适应) ---
        function calculateNoteWordCount(text) {
            if (!text) return 0;
            // 过滤掉 markdown 图片语法避免路径被误计
            let clean = text.replace(/!\[([^\]]*)\]\([^\)]+\)/g, '').trim();
            if (!clean) return 0;
            // 提取中日韩文字 (每个字符算 1 字)
            const cjkMatches = clean.match(/[\u4e00-\u9fa5\u3040-\u30ff\uac00-\ud7af]/g) || [];
            // 提取中文全角标点符号 (每个符号算 1 字)
            const punctMatches = clean.match(/[\u3000-\u303f\uff01-\uff60\u201c\u201d\u2018\u2019\u2014\u2026]/g) || [];
            // 提取英文字词及连续数字 (每个连续单词/数字算 1 字，严格契合 Word 规范)
            const wordMatches = clean
                .replace(/[\u4e00-\u9fa5\u3040-\u30ff\uac00-\ud7af\u3000-\u303f\uff01-\uff60\u201c\u201d\u2018\u2019\u2014\u2026]/g, ' ')
                .match(/[a-zA-Z0-9_\-]+/g) || [];
            const count = cjkMatches.length + punctMatches.length + wordMatches.length;
            return count > 0 ? count : clean.replace(/\s+/g, '').length;
        }

        function updateWordCount() {
            const badgeText = document.getElementById('word-count-text');
            if (!badgeText) return;
            const title = document.getElementById('note-title')?.value || '';
            const content = document.getElementById('note-content')?.value || '';
            const combined = (title ? title + '\n' : '') + content;
            badgeText.innerText = `${calculateNoteWordCount(combined)}字`;
        }

        function saveCurrentState() {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (note && !note.isDeleted) {
                note.title = document.getElementById('note-title').value;
                note.content = document.getElementById('note-content').value;
                note.updatedAt = new Date().toISOString();
                
                document.getElementById('editor-date').innerText = `更新于：${formatDate(note.updatedAt)}`;
                
                saveDataToStorage();
                updateSidebarItemDOM(note);
                updateWordCount();
            }
        }

        function deleteActiveNote() {
            if (!activeNoteId) return;
            const noteIndex = notes.findIndex(n => n.id === activeNoteId);
            if (noteIndex === -1) return;

            const note = notes[noteIndex];

            if (note.isDeleted) {
                // 如果已经在回收站中，则代表彻底销毁
                notes.splice(noteIndex, 1);
            } else {
                // 否则进入“软删除”流程
                note.isDeleted = true;
                note.deletedAt = new Date().toISOString();
                note.isStarred = false; // 进入回收站自动摘星
            }
            
            saveDataToStorage();
            
            // 刷新并寻找下一个可渲染的项
            const currentViewNotes = getFilteredNotes();
            if (currentViewNotes.length > 0) {
                switchActiveNote(currentViewNotes[0].id);
            } else {
                showEmptyState();
            }
            renderSidebar();
        }

        function restoreActiveNote() {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (note && note.isDeleted) {
                note.isDeleted = false;
                note.deletedAt = null;
                note.updatedAt = new Date().toISOString();
                
                saveDataToStorage();
                switchActiveNote(activeNoteId);
                renderSidebar();
            }
        }

        function toggleActiveNoteStar() {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (note && !note.isDeleted) {
                note.isStarred = !note.isStarred;
                saveDataToStorage();
                switchActiveNote(activeNoteId);
            }
        }

        function updateActiveNoteTag(selectedTag) {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (note && !note.isDeleted) {
                note.tag = (note.tag === selectedTag) ? '' : selectedTag;
                saveDataToStorage();
                switchActiveNote(activeNoteId);

        }

        function showEmptyState() {

            document.getElementById('empty-state').classList.remove('hidden');
            document.getElementById('editor-container').classList.add('hidden');

        }

        // --- 多选模式与导出 Word ---
